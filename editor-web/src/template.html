<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="__CSP__">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="referrer" content="no-referrer">
<style>
html,body{margin:0;padding:0;min-height:100%;-webkit-text-size-adjust:100%}
body{background:#fff}
#root{min-height:100vh;box-sizing:border-box}
.ProseMirror{outline:none;min-height:70vh;caret-color:var(--accent);white-space:pre-wrap;word-wrap:break-word}
.ProseMirror-selectednode{outline:2px solid var(--accent2)}
.ProseMirror-gapcursor:after{border-top:1px solid var(--ink)}
#root{position:relative}
.pk-cols>.pk-col{min-height:1.5em}
.pk-table p{margin:0}
.selectedCell{background:rgba(127,127,127,.15)}
.sn-menu{position:absolute;left:12px;right:12px;z-index:10;max-height:46vh;overflow-y:auto;background:#fff;color:#1F2328;border:1px solid #E6E1DA;border-radius:16px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:6px;font-family:-apple-system,Roboto,sans-serif}
.sn-menu[hidden]{display:none}
.sn-item{display:flex;align-items:center;gap:12px;width:100%;min-height:48px;padding:6px 8px;border:0;border-radius:10px;background:transparent;text-align:left;font:inherit;color:inherit}
.sn-item:active,.sn-item:focus{background:#F1EEE9;outline:none}
.sn-prev{width:96px;height:40px;overflow:hidden;flex:0 0 96px;border-radius:8px;background:var(--paper);color:var(--ink);pointer-events:none}
.sn-prev>*{transform:scale(.55);transform-origin:0 0;width:180%;margin:0!important}
.sn-label{font-size:15px;font-weight:600}
.sn-flash{outline:3px solid var(--accent2);outline-offset:2px;transition:outline-color 1.2s}
/* P4b ink layers: under = behind the text (highlighter), over = on top (pen). Never take touches. */
.ink-layer{position:absolute;left:0;top:0;width:0;height:0;overflow:visible;pointer-events:none}
#ink-under{z-index:0}#editor{position:relative;z-index:1}#ink-over{z-index:2}
.ink-b{position:absolute;aspect-ratio:1/1;height:auto;overflow:visible;pointer-events:none}
/* P4b: tablets get a fixed, centred page width (decision Q3), so ink looks the same in portrait and landscape. */
#root{zoom:var(--ink-zoom,1)}
@media (min-width:800px){#root{max-width:760px;margin:0 auto}}
/* P4b sketch block: a framed drawing area in the note flow. */
.pk-sketch{position:relative;margin:calc(var(--gap)*.5) 0;border:1.5px dashed var(--soft,#ccc);border-radius:10px;min-height:120px;box-sizing:border-box}
.pk-sketch.ProseMirror-selectednode{outline:2px solid var(--accent2)}
</style>
<style id="fonts"></style>
<style id="theme"></style>
</head>
<body>
<div id="root" class="pk"><div id="editor"></div></div>
<script>__SCRIPT__</script>
</body>
</html>
